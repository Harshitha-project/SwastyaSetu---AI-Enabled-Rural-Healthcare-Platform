version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: swasthyasetu-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=swasthyasetu
    networks:
      - swasthyasetu-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasthyasetu-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/swasthyasetu
      - JWT_ACCESS_SECRET=dev-access-secret-key-for-development-only
      - JWT_REFRESH_SECRET=dev-refresh-secret-key-for-development-only
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - swasthyasetu-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: swasthyasetu-ai
    ports:
      - "8000:8000"
    networks:
      - swasthyasetu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swasthyasetu-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - swasthyasetu-network

volumes:
  mongodb_data:

networks:
  swasthyasetu-network:
    driver: bridge
